<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HDM Bonnen Test v2</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--line:#e7dece;--gold:#be8f2f;--green:#eaf7e9;--text:#24211d;--muted:#746f68}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px 12px 48px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.upload{border:2px dashed #d4b76e;border-radius:18px;padding:24px 14px;text-align:center;background:#fffaf0}.upload input{width:100%;font-size:16px}.status{margin-top:12px;padding:12px;border-radius:12px;background:#f5ecd9;line-height:1.4}.ok{background:#e5f5e7}.bad{background:#ffe7e2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:var(--green);border:1px solid var(--line);border-radius:14px;padding:12px}.field small{display:block;color:var(--muted);margin-bottom:5px}.field strong{font-size:21px;word-break:break-word}.wide{grid-column:1/-1}canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:12px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.35;background:#f6f4ef;padding:12px;border-radius:12px;max-height:360px;overflow:auto}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>
</head>
<body>
<div class="wrap">
<div class="card"><h1>Bonnen uitlezen — test v2</h1><p>Losse Safari-test. Er wordt <b>niets opgeslagen</b> in HDM Office.</p></div>
<div class="card"><div class="upload"><h2>📷 Kies bonfoto</h2><input id="file" type="file" accept="image/*,.heic,.heif"><div id="status" class="status">Nog geen bestand gekozen.</div></div></div>
<div class="card"><h2>Herkende gegevens</h2><div class="grid"><div class="field"><small>Leverancier</small><strong id="supplier">—</strong></div><div class="field"><small>Datum</small><strong id="date">—</strong></div><div class="field"><small>Totaal incl. btw</small><strong id="total">—</strong></div><div class="field"><small>BTW totaal</small><strong id="vat">—</strong></div><div class="field wide"><small>Betaalwijze</small><strong id="method">—</strong></div></div></div>
<div class="card"><h2>OCR-controle</h2><canvas id="preview"></canvas><details><summary>OCR-tekst tonen</summary><pre id="raw">Nog niets uitgelezen.</pre></details></div>
</div>
<script>
const $=id=>document.getElementById(id);
const euro=n=>Number(n).toLocaleString('nl-NL',{style:'currency',currency:'EUR'});
function norm(s){return String(s||'').replace(/\r/g,'').replace(/[\u00a0\u202f]/g,' ').replace(/[|]/g,'1').replace(/(\d)[oO](?=\d)/g,'$10').replace(/(\d)[lI](?=\d|\b)/g,'$11');}
function num(s){s=String(s||'').replace(/[€EUR\s]/gi,'').replace(/[^0-9,.-]/g,'');if(!s)return NaN;const c=s.lastIndexOf(','),d=s.lastIndexOf('.');if(c>=0&&d>=0)s=c>d?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(c>=0)s=s.replace(/\./g,'').replace(',','.');return Number(s);}
function amounts(line){const s=norm(line).replace(/(\d{1,5})\s+(\d{2})(?!\d)/g,'$1,$2');const out=[];for(const m of s.matchAll(/(?:€\s*)?(\d{1,5}(?:[.,]\d{2}))(?:\s*(?:€|EUR))?/gi)){const n=num(m[1]);if(Number.isFinite(n)&&n>=0&&n<10000)out.push(n)}return out}
function parseSupplier(t,file){if(/\bGAMMA\b/i.test(t))return'Gamma';if(/\bPRAXIS\b/i.test(t))return'Praxis';if(/\bKARWEI\b/i.test(t))return'Karwei';if(/\bHORNBACH\b/i.test(t))return'Hornbach';return String(file.name||'').replace(/\.[^.]+$/,'').split(/[ _-]+/)[0]||''}
function parseDate(t){let m=norm(t).match(/(?:datum\s*[:.-]?\s*)?(\d{1,2})[\/-](\d{1,2})[\/-](20\d{2})/i);if(!m)m=norm(t).match(/\bdd\.?\s*(\d{1,2})-(\d{1,2})-(20\d{2})/i);if(!m)return'';return`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}
function parseMethod(t){if(/maestro|mastercard|visa|pin|kaart|debit|contactless/i.test(t))return'Pin';if(/contant|cash/i.test(t))return'Contant';if(/ideal|i-deal/i.test(t))return'iDEAL';return'Bank'}
function parseTotal(t){const lines=norm(t).split(/\n+/).map(x=>x.trim()).filter(Boolean);let best=[];for(let i=0;i<lines.length;i++){if(/\b(?:9\s*)?t[o0]taal\b|tot\.?\s*omzet|te\s*betalen|eindt[o0]taal/i.test(lines[i])){const vals=amounts(lines[i]+' '+(lines[i+1]||''));best.push(...vals.filter(v=>v>0))}}if(best.length){const freq={};best.forEach(v=>freq[v]=(freq[v]||0)+1);return Number(Object.keys(freq).sort((a,b)=>freq[b]-freq[a]||Number(b)-Number(a))[0])}const all=[];for(const l of lines){if(/btw|vat|tax|%/i.test(l))continue;all.push(...amounts(l).filter(v=>v>0))}return all.length?Math.max(...all):NaN}
function parseVat(t,total){const lines=norm(t).split(/\n+/).map(x=>x.trim()).filter(Boolean);for(let i=0;i<lines.length;i++){if(/tot\.?\s*btw|t[o0]t\.?\s*btw/i.test(lines[i])){const vals=amounts(lines[i]+' '+(lines[i+1]||''));const good=vals.filter(v=>v>0&&(!Number.isFinite(total)||v<total));if(good.length)return good[good.length-1]}}const parts=[];for(const l of lines){if(!/btw/i.test(l)||!/%/.test(l))continue;const vals=amounts(l);if(vals.length){const v=vals[vals.length-1];if(v>0&&(!Number.isFinite(total)||v<total*.5))parts.push(v)}}if(parts.length>=2)return Number(parts.reduce((a,b)=>a+b,0).toFixed(2));if(parts.length===1)return parts[0];return NaN}
async function imageFromFile(file){let blob=file;if(/\.hei[cf]$/i.test(file.name||'')||/^image\/hei[cf]$/i.test(file.type||'')){if(!window.HeicTo)throw new Error('HEIC-converter niet geladen');let out=await window.HeicTo({blob:file,type:'image/jpeg',quality:.98});blob=Array.isArray(out)?out[0]:out}const url=URL.createObjectURL(blob);try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});return img}finally{setTimeout(()=>URL.revokeObjectURL(url),2000)}}
function baseCanvas(img){const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;const sx=Math.round(iw*.16),sy=Math.round(ih*.015),sw=Math.round(iw*.68),sh=Math.round(ih*.97);const scale=Math.min(2.3,2000/sw);const c=$('preview');c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);return c}
function enhance(src,bw=false){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);const im=x.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];g=bw?(g>176?255:0):Math.max(0,Math.min(255,(g-128)*1.7+128));d[i]=d[i+1]=d[i+2]=g}x.putImageData(im,0,0);return c}
function crop(src,a,b){const c=document.createElement('canvas');const y=Math.round(src.height*a),h=Math.round(src.height*(b-a));c.width=src.width;c.height=h;c.getContext('2d').drawImage(src,0,y,src.width,h,0,0,src.width,h);return c}
async function runOcr(canvases){if(!window.Tesseract||typeof window.Tesseract.createWorker!=='function')throw new Error('Tesseract is niet geladen');const worker=await window.Tesseract.createWorker('nld+eng');try{await worker.setParameters({preserve_interword_spaces:'1'});const texts=[];for(let i=0;i<canvases.length;i++){$('status').textContent=`Uitlezen… stap ${i+1} van ${canvases.length}`;const r=await worker.recognize(canvases[i]);texts.push(r.data.text||'')}return texts.join('\n--- VOLGENDE OCR PASS ---\n')}finally{await worker.terminate()}}
$('file').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;$('status').className='status';$('status').textContent='Foto voorbereiden…';['supplier','date','total','vat','method'].forEach(id=>$(id).textContent='…');try{const img=await imageFromFile(file),base=baseCanvas(img),gray=enhance(base,false),bw=enhance(base,true);const text=await runOcr([gray,crop(gray,.22,.72),crop(bw,.22,.72),crop(gray,.40,.80)]);$('raw').textContent=text;const supplier=parseSupplier(text,file),date=parseDate(text),total=parseTotal(text),vat=parseVat(text,total),method=parseMethod(text);$('supplier').textContent=supplier||'Niet herkend';$('date').textContent=date?new Date(date+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}):'Niet herkend';$('total').textContent=Number.isFinite(total)?euro(total):'Niet herkend';$('vat').textContent=Number.isFinite(vat)?euro(vat):'Niet herkend';$('method').textContent=method;const ok=Number.isFinite(total)&&Number.isFinite(vat);$('status').className='status '+(ok?'ok':'bad');$('status').textContent=ok?`Gelukt: totaal ${euro(total)} en btw ${euro(vat)} gevonden.`:'OCR werkt nu, maar totaal/btw zijn nog niet allebei herkend. Open “OCR-tekst tonen”.'}catch(err){console.error(err);$('status').className='status bad';$('status').textContent='Uitlezen mislukt: '+(err&&err.message?err.message:err);$('raw').textContent=String(err&&err.stack?err.stack:err)}});
</script>
</body>
</html>
